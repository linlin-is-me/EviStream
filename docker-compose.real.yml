services:
  migrate:
    environment: &real-model-environment
      EVISTREAM_MODEL_PROFILE: ${EVISTREAM_MODEL_PROFILE:?set EVISTREAM_MODEL_PROFILE}
      EVISTREAM_MODEL_BASE_URL: ${EVISTREAM_MODEL_BASE_URL:?set EVISTREAM_MODEL_BASE_URL}
      EVISTREAM_MODEL_API_KEY: ${EVISTREAM_MODEL_API_KEY:?set EVISTREAM_MODEL_API_KEY}
      EVISTREAM_AGENT_MODEL: ${EVISTREAM_AGENT_MODEL:?set EVISTREAM_AGENT_MODEL}
      EVISTREAM_TRIAGE_MODEL: ${EVISTREAM_TRIAGE_MODEL:?set EVISTREAM_TRIAGE_MODEL}
      EVISTREAM_VERIFY_MODEL: ${EVISTREAM_VERIFY_MODEL:?set EVISTREAM_VERIFY_MODEL}
      EVISTREAM_JUDGE_MODEL: ${EVISTREAM_JUDGE_MODEL:?set EVISTREAM_JUDGE_MODEL}
      EVISTREAM_EMBEDDING_MODEL: ${EVISTREAM_EMBEDDING_MODEL:?set EVISTREAM_EMBEDDING_MODEL}
      EVISTREAM_ASR_BACKEND: ${EVISTREAM_ASR_BACKEND:-mock}
      EVISTREAM_OCR_BACKEND: ${EVISTREAM_OCR_BACKEND:-mock}
      EVISTREAM_VISION_BACKEND: ${EVISTREAM_VISION_BACKEND:-gateway}
  api:
    environment: *real-model-environment
  worker:
    environment: *real-model-environment
