name: CI

on:
  push:
    branches: [main, "stage/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: evistream
          POSTGRES_USER: evistream
          POSTGRES_PASSWORD: evistream
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U evistream -d evistream"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      EVISTREAM_DATABASE_URL: postgresql+psycopg://evistream:evistream@127.0.0.1:54329/evistream
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy evistream apps
      - name: Check Linux toolchain
        run: make doctor
      - name: Verify Stage 3
        run: make verify-stage3 PYTHON=python
      - name: Start API and verify health
        shell: bash
        run: |
          uvicorn apps.api.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health | tee health.json; then
              break
            fi
            sleep 0.5
          done
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("health.json").read_text())
          assert payload == {
              "status": "ok",
              "service": "evistream-api",
              "version": "0.1.0.dev0",
              "mode": "development",
          }
          PY

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test --run
      - run: pnpm build
