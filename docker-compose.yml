services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: evistream
      POSTGRES_USER: evistream
      POSTGRES_PASSWORD: evistream
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - evistream-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evistream -d evistream"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  evistream-postgres:
